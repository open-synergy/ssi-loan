options:
  auto_refresh: true

setup:
  steps:
    - step: "Get receivable account type"
      action: "ref"
      xml_id: "account.data_account_type_receivable"
      save_as: "receivable_acc_type"

    - step: "Get revenue account type"
      action: "ref"
      xml_id: "account.data_account_type_revenue"
      save_as: "revenue_acc_type"

    # `setup:` replays before every scenario in the same transaction (no
    # rollback in between), so a fixed `code` would collide with the
    # previous scenario's record on the 2nd+ replay (code is unique per
    # company). Generate a fresh, never-colliding code on each replay.
    - step: "Create realization account"
      action: "create"
      model: "account.account"
      save_as: "account_realization"
      values:
        code: "EVAL: 'LOREAL%d' % env['account.account'].search_count([])"
        name: "Test Loan Out Realization Account"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create rounding account"
      action: "create"
      model: "account.account"
      save_as: "account_rounding"
      values:
        code: "EVAL: 'LOROUND%d' % env['account.account'].search_count([])"
        name: "Test Loan Out Rounding Account"
        user_type_id: "REC: revenue_acc_type.id"

    - step: "Create interest account"
      action: "create"
      model: "account.account"
      save_as: "account_interest"
      values:
        code: "EVAL: 'LOINT%d' % env['account.account'].search_count([])"
        name: "Test Loan Out Interest Account"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create interest income account"
      action: "create"
      model: "account.account"
      save_as: "account_interest_income"
      values:
        code: "EVAL: 'LOINC%d' % env['account.account'].search_count([])"
        name: "Test Loan Out Interest Income Account"
        user_type_id: "REC: revenue_acc_type.id"

    # `_get_realization_move_line_account` (loan_payment_schedule_mixin.py)
    # picks the long- or short-term principle account depending on how far
    # `schedule_date` is from `fields.Date.today()` (real server date, not
    # the fixed 2024 dates used below). Both are required so the realization
    # move -- exercised by the ready/cancel scenarios below -- always finds
    # a matching account regardless of when this suite runs.
    - step: "Create short-term principle account"
      action: "create"
      model: "account.account"
      save_as: "account_principle_short"
      values:
        code: "EVAL: 'LOPRS%d' % env['account.account'].search_count([])"
        name: "Test Loan Out Short-Term Principle Account"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create long-term principle account"
      action: "create"
      model: "account.account"
      save_as: "account_principle_long"
      values:
        code: "EVAL: 'LOPRL%d' % env['account.account'].search_count([])"
        name: "Test Loan Out Long-Term Principle Account"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create realization journal"
      action: "create"
      model: "account.journal"
      save_as: "realization_journal"
      values:
        name:
          "EVAL: 'Test Loan Out Realization Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'OJ%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create interest journal"
      action: "create"
      model: "account.journal"
      save_as: "interest_journal"
      values:
        name:
          "EVAL: 'Test Loan Out Interest Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'OK%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create flat interest loan type"
      action: "create"
      model: "loan.type"
      save_as: "loan_type_flat_out"
      values:
        name: "Test Flat Loan Out"
        code: "/"
        direction: "out"
        interest_method: "flat"
        currency_id: "REF: base.USD"
        interest_amount: 3.0
        maximum_loan_amount: 6000.0
        maximum_installment_period: 12
        realization_journal_id: "REC: realization_journal.id"
        account_realization_id: "REC: account_realization.id"
        account_rounding_id: "REC: account_rounding.id"
        interest_journal_id: "REC: interest_journal.id"
        account_interest_id: "REC: account_interest.id"
        account_interest_income_id: "REC: account_interest_income.id"
        short_account_principle_id: "REC: account_principle_short.id"
        long_account_principle_id: "REC: account_principle_long.id"

    - step: "Create anuity interest loan type"
      action: "create"
      model: "loan.type"
      save_as: "loan_type_anuity_out"
      values:
        name: "Test Anuity Loan Out"
        code: "/"
        direction: "out"
        interest_method: "anuity"
        currency_id: "REF: base.USD"
        interest_amount: 3.0
        maximum_loan_amount: 6000.0
        maximum_installment_period: 12
        realization_journal_id: "REC: realization_journal.id"
        account_realization_id: "REC: account_realization.id"
        account_rounding_id: "REC: account_rounding.id"
        interest_journal_id: "REC: interest_journal.id"
        account_interest_id: "REC: account_interest.id"
        account_interest_income_id: "REC: account_interest_income.id"
        short_account_principle_id: "REC: account_principle_short.id"
        long_account_principle_id: "REC: account_principle_long.id"

    - step: "Create effective interest loan type"
      action: "create"
      model: "loan.type"
      save_as: "loan_type_effective_out"
      values:
        name: "Test Effective Loan Out"
        code: "/"
        direction: "out"
        interest_method: "effective"
        currency_id: "REF: base.USD"
        interest_amount: 3.0
        maximum_loan_amount: 6000.0
        maximum_installment_period: 12
        realization_journal_id: "REC: realization_journal.id"
        account_realization_id: "REC: account_realization.id"
        account_rounding_id: "REC: account_rounding.id"
        interest_journal_id: "REC: interest_journal.id"
        account_interest_id: "REC: account_interest.id"
        account_interest_income_id: "REC: account_interest_income.id"
        short_account_principle_id: "REC: account_principle_short.id"
        long_account_principle_id: "REC: account_principle_long.id"

    # `code: "/"` triggers auto-sequence assignment (same trick as the loan
    # types above), so this fixture stays safe across the repeated `setup:`
    # replay before every scenario in this file.
    - step: "Create collateral type"
      action: "create"
      model: "loan_collateral_type"
      save_as: "collateral_type"
      values:
        name: "Test Loan Collateral Type"
        code: "/"

    # `approval_template_data.xml` ships a default approval.template for
    # `loan.out` whose sole approver group is `loan_out_validator_group`.
    # The group's XML `users=` eval already lists admin, but
    # `action_request_approval` (mixin_multiple_approval.py) resolves
    # approvers from `res.groups.users` at runtime -- the same explicit
    # `groups_id` write used by `test_ui_loan_out.py::setUp` is needed here
    # too, or `action_approve_approval`/`action_reject_approval` never find
    # admin as an active approver and the state never moves off `confirm`.
    - step: "Get admin user"
      action: "ref"
      xml_id: "base.user_admin"
      save_as: "admin_user"

    - step: "Add admin to the loan out validator group"
      action: "write"
      target: "admin_user"
      values:
        groups_id: [[4, "REF: ssi_loan.loan_out_validator_group"]]

scenarios:
  - name: "Loan Out - Flat interest workflow"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Loan Out Partner"
          is_company: false

      - step: "Create loan.out with flat interest type"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_flat"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Assert loan.out created in draft"
        action: "assert"
        target: "loan_out_flat"
        asserts:
          state:
            type: "value"
            expected: "draft"
          loan_amount:
            type: "value"
            expected: 3000.0
          manual_loan_period:
            type: "value"
            expected: 6

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_out_flat"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert payment schedules generated"
        action: "assert"
        target: "loan_out_flat"
        asserts:
          total_principle_amount:
            type: "value"
            expected: 3000.0

      - step: "Confirm loan.out"
        action: "call"
        target: "loan_out_flat"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.out is confirmed"
        action: "assert"
        target: "loan_out_flat"
        asserts:
          state:
            type: "value"
            expected: "confirm"

  - name: "Loan Out - Anuity interest workflow"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_anuity"
        values:
          name: "Test Loan Out Anuity Partner"

      - step: "Create loan.out with anuity type"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_anuity"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_anuity.id"
          type_id: "REC: loan_type_anuity_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 4000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 12
          first_payment_date: "2024-02-01"

      - step: "Compute anuity payment"
        action: "call"
        target: "loan_out_anuity"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert anuity loan created"
        action: "assert"
        target: "loan_out_anuity"
        asserts:
          state:
            type: "value"
            expected: "draft"
          loan_amount:
            type: "value"
            expected: 4000.0

  - name: "Loan Out - Effective interest workflow"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_eff"
        values:
          name: "Test Loan Out Effective Partner"

      - step: "Create loan.out with effective type"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_eff"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_eff.id"
          type_id: "REC: loan_type_effective_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 2400.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute effective payment"
        action: "call"
        target: "loan_out_eff"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Confirm effective loan.out"
        action: "call"
        target: "loan_out_eff"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert effective loan confirmed"
        action: "assert"
        target: "loan_out_eff"
        asserts:
          state:
            type: "value"
            expected: "confirm"

  - name: "Loan Out - onchange type_id fills and resets derived fields"
    steps:
      - step: "Fill type_id on a new loan.out form"
        action: "form"
        model: "loan.out"
        save: false
        ops:
          - set: {type_id: "REC: loan_type_flat_out"}
          - assert:
              maximum_loan_amount:
                type: "value"
                expected: 6000.0
              maximum_installment_period:
                type: "value"
                expected: 12
              interest:
                type: "value"
                expected: 3.0
          # Odoo's Form.__setattr__ requires an empty recordset of the
          # right model to clear a many2one -- plain `false` fails its
          # own `isinstance(value, BaseModel)` assertion, it is not a
          # no-op.
          - set: {type_id: "EVAL: env['loan.type']"}
          - assert:
              maximum_loan_amount:
                type: "value"
                expected: 0.0
              maximum_installment_period:
                type: "value"
                expected: 0
              interest:
                type: "value"
                expected: 0.0

  - name: "Loan Out - confirm rejected when schedule not computed"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_no_schedule"
        values:
          name: "Test Loan Out No Schedule Partner"

      - step: "Create loan.out without computing payment schedule"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_no_schedule"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_no_schedule.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Confirm without computed schedule is rejected"
        action: "call"
        target: "loan_out_no_schedule"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        expect_error:
          type: "ValidationError"
          message_contains: "different with loan amount"

      - step: "Assert loan.out stays draft"
        action: "assert"
        target: "loan_out_no_schedule"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Loan Out - confirm rejected when loan amount exceeds type maximum"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_over_limit"
        values:
          name: "Test Loan Out Over Limit Partner"

      - step: "Create loan.out with amount above the type maximum"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_over_limit"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_over_limit.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 7200.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_out_over_limit"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert schedule matches loan amount"
        action: "assert"
        target: "loan_out_over_limit"
        asserts:
          total_principle_amount:
            type: "value"
            expected: 7200.0

      - step: "Confirm above maximum loan amount is rejected"
        action: "call"
        target: "loan_out_over_limit"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        expect_error:
          type: "ValidationError"
          message_contains: "cannot exceed the maximum total loan"

      - step: "Assert loan.out stays draft"
        action: "assert"
        target: "loan_out_over_limit"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Loan Out - aggregate compute fields are empty before schedule is computed"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_empty"
        values:
          name: "Test Loan Out Empty Partner"

      - step: "Create loan.out without computing payment schedule"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_empty"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_empty.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 6000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Assert all aggregates are empty"
        action: "assert"
        target: "loan_out_empty"
        asserts:
          total_principle_amount:
            type: "value"
            expected: 0.0
          total_interest_amount:
            type: "value"
            expected: 0.0
          total_manual_principle_amount:
            type: "value"
            expected: 0.0
          paid:
            type: "value"
            expected: false
          realized:
            type: "value"
            expected: false

  - name: "Loan Out - aggregate compute fields after schedule is computed"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_normal"
        values:
          name: "Test Loan Out Normal Partner"

      - step: "Create loan.out with an evenly-divisible flat schedule"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_normal"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_normal.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 6000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_out_normal"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert aggregates match the flat schedule"
        action: "assert"
        target: "loan_out_normal"
        asserts:
          total_principle_amount:
            type: "value"
            expected: 6000.0
          total_manual_principle_amount:
            type: "value"
            expected: 0.0
          total_interest_amount:
            type: "value"
            expected: 90.0
          paid:
            type: "value"
            expected: false

  - name: "Loan Out - manual schedule moves principle out of the auto-reconciled total"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_manual"
        values:
          name: "Test Loan Out Manual Partner"

      - step: "Create loan.out with an evenly-divisible flat schedule"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_manual"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_manual.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 6000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_out_manual"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Find the 3rd installment by loan_id and schedule_date"
        action: "search"
        model: "loan.payment_schedule_out"
        domain:
          - ["loan_id", "=", "REC: loan_out_manual.id"]
          - ["schedule_date", "=", "2024-04-01"]
        save_as: "schedule_row_manual"
        expect_count: 1

      - step: "Mark the found installment as manually controlled"
        action: "write"
        target: "schedule_row_manual"
        values:
          principle_payment_state: "manual"

      - step: "Assert principle moved to the manual total, interest unchanged"
        action: "assert"
        target: "loan_out_manual"
        asserts:
          total_manual_principle_amount:
            type: "value"
            expected: 1000.0
          total_principle_amount:
            type: "value"
            expected: 5000.0
          total_interest_amount:
            type: "value"
            expected: 90.0

  - name: "Loan Out - collateral lines created inline are stored on loan_out.collateral"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_collateral"
        values:
          name: "Test Loan Out Collateral Partner"

      - step: "Create loan.out with two inline collateral lines"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_collateral"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_collateral.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"
          collateral_ids:
            - - 0
              - 0
              - type_id: "REC: collateral_type.id"
                name: "Collateral Out Line A"
            - - 0
              - 0
              - type_id: "REC: collateral_type.id"
                name: "Collateral Out Line B"

      - step: "Assert two collateral lines attached to loan.out"
        action: "assert"
        target: "loan_out_collateral"
        asserts:
          collateral_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Find collateral line A on loan_out.collateral"
        action: "search"
        model: "loan_out.collateral"
        domain:
          - ["loan_id", "=", "REC: loan_out_collateral.id"]
          - ["name", "=", "Collateral Out Line A"]
        save_as: "collateral_out_line_a"
        expect_count: 1

      - step: "Assert collateral line A points to the right loan and type"
        action: "assert"
        target: "collateral_out_line_a"
        asserts:
          loan_id.id:
            type: "value"
            expected: "REC: loan_out_collateral.id"
          type_id.id:
            type: "value"
            expected: "REC: collateral_type.id"

  - name: "Loan Out - collateral lines are removed when the loan is deleted (cascade)"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_collateral_cascade"
        values:
          name: "Test Loan Out Collateral Cascade Partner"

      - step: "Create loan.out with two inline collateral lines to be deleted"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_collateral_cascade"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_collateral_cascade.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"
          collateral_ids:
            - - 0
              - 0
              - type_id: "REC: collateral_type.id"
                name: "Collateral Out Cascade Line A"
            - - 0
              - 0
              - type_id: "REC: collateral_type.id"
                name: "Collateral Out Cascade Line B"

      - step: "Assert two collateral lines attached before delete"
        action: "assert"
        target: "loan_out_collateral_cascade"
        asserts:
          collateral_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Delete loan.out"
        action: "unlink"
        target: "loan_out_collateral_cascade"

      - step: "Assert collateral lines were deleted along with the loan"
        action: "search"
        model: "loan_out.collateral"
        domain:
          - [
              "name",
              "in",
              ["Collateral Out Cascade Line A", "Collateral Out Cascade Line B"],
            ]
        save_as: "collateral_out_cascade_result"
        expect_count: 0

  - name: "Loan Out - approve to ready posts the realization move"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_ready"
        values:
          name: "Test Loan Out Ready Partner"

      - step: "Create loan.out with flat interest type"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_ready"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_ready.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_out_ready"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Confirm loan.out"
        action: "call"
        target: "loan_out_ready"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Approve loan.out"
        action: "call"
        target: "loan_out_ready"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.out is ready with a posted realization move"
        action: "assert"
        target: "loan_out_ready"
        asserts:
          state:
            type: "value"
            expected: "ready"
          move_realization_id:
            type: "value"
            operator: "is_truthy"
          move_line_header_id:
            type: "value"
            operator: "is_truthy"
          move_realization_id.state:
            type: "value"
            expected: "posted"

  - name: "Loan Out - reject moves the loan to reject state"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_reject"
        values:
          name: "Test Loan Out Reject Partner"

      - step: "Create loan.out with flat interest type"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_reject"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_reject.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_out_reject"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Confirm loan.out"
        action: "call"
        target: "loan_out_reject"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Reject loan.out"
        action: "call"
        target: "loan_out_reject"
        method: "action_reject_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.out is rejected"
        action: "assert"
        target: "loan_out_reject"
        asserts:
          state:
            type: "value"
            expected: "reject"

  - name: "Loan Out - restart from reject returns the loan to draft"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_restart"
        values:
          name: "Test Loan Out Restart Partner"

      - step: "Create loan.out with flat interest type"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_restart"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_restart.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_out_restart"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Confirm loan.out"
        action: "call"
        target: "loan_out_restart"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Reject loan.out"
        action: "call"
        target: "loan_out_restart"
        method: "action_reject_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Restart rejected loan.out"
        action: "call"
        target: "loan_out_restart"
        method: "action_restart"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.out is back to draft"
        action: "assert"
        target: "loan_out_restart"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Loan Out - cancel from ready removes the realization move"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_cancel"
        values:
          name: "Test Loan Out Cancel Partner"

      - step: "Create loan.out with flat interest type"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_cancel"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_cancel.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"
          # `loan_out_internal_user_rule` only lets a user see records
          # where `user_id` is themselves. Without this, the record
          # defaults to the transaction's own user (superuser -- always
          # bypasses record rules), but the cancel wizard step below acts
          # `as_user: base.user_admin` (not superuser) and its `asserts:`
          # re-read the document under that same non-superuser env (see
          # `_rebind`/`auto_refresh` in odoo-yaml-test), which runs the
          # ir.rule for real and denies admin unless it owns the record.
          user_id: "REC: admin_user.id"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_out_cancel"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Confirm loan.out"
        action: "call"
        target: "loan_out_cancel"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Approve loan.out"
        action: "call"
        target: "loan_out_cancel"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.out is ready before cancelling"
        action: "assert"
        target: "loan_out_cancel"
        asserts:
          state:
            type: "value"
            expected: "ready"

      - step: "Create cancel reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "cancel_reason_out"
        values:
          name: "Test Loan Out Cancel Reason"
          code: "TLOCANCEL"

      - step: "Cancel loan.out via the cancel reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "loan_out_cancel"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        values:
          cancel_reason_id: "REC: cancel_reason_out.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"
          cancel_reason_id:
            type: "m2o"
            expected: "REC: cancel_reason_out"
          move_realization_id:
            type: "value"
            operator: "is_falsy"
          move_line_header_id:
            type: "value"
            operator: "is_falsy"

      - step: "Assert the realization journal entry no longer exists"
        action: "search"
        model: "account.move"
        domain:
          - ["ref", "=", "REC: loan_out_cancel.name"]
        save_as: "cancel_move_search_out"
        expect_count: 0
