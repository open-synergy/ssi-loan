scenarios:
  - name: "Loan Out - Flat interest workflow"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Loan Out Partner"
          is_company: false

      - step: "Create loan.out with flat interest type"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_flat"
        values:
          date: "2024-01-01"
          partner_id: "EVAL: registry['partner'].id"
          type_id: "REF: ssi_loan.demo_type_out1"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Assert loan.out created in draft"
        action: "assert"
        target: "loan_out_flat"
        asserts:
          state:
            type: "value"
            expected: "draft"
          loan_amount:
            type: "value"
            expected: 3000.0
          manual_loan_period:
            type: "value"
            expected: 6

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_out_flat"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Invalidate cache after compute"
        action: "call"
        target: "loan_out_flat"
        method: "invalidate_cache"

      - step: "Assert payment schedules generated"
        action: "assert"
        target: "loan_out_flat"
        asserts:
          total_principle_amount:
            type: "value"
            expected: 3000.0

      - step: "Confirm loan.out"
        action: "call"
        target: "loan_out_flat"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "loan_out_flat"
        method: "invalidate_cache"

      - step: "Assert loan.out is confirmed"
        action: "assert"
        target: "loan_out_flat"
        asserts:
          state:
            type: "value"
            expected: "confirm"

