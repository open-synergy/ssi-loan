options:
  auto_refresh: true

setup:
  steps:
    - step: "Get receivable account type"
      action: "ref"
      xml_id: "account.data_account_type_receivable"
      save_as: "receivable_acc_type"

    - step: "Get revenue account type"
      action: "ref"
      xml_id: "account.data_account_type_revenue"
      save_as: "revenue_acc_type"

    # `setup:` replays before every scenario in the same transaction (no
    # rollback in between), so a fixed `code` would collide with the
    # previous scenario's record on the 2nd+ replay (code is unique per
    # company). Generate a fresh, never-colliding code on each replay.
    - step: "Create realization account"
      action: "create"
      model: "account.account"
      save_as: "account_realization"
      values:
        code: "EVAL: 'LOREAL%d' % env['account.account'].search_count([])"
        name: "Test Loan Out Realization Account"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create rounding account"
      action: "create"
      model: "account.account"
      save_as: "account_rounding"
      values:
        code: "EVAL: 'LOROUND%d' % env['account.account'].search_count([])"
        name: "Test Loan Out Rounding Account"
        user_type_id: "REC: revenue_acc_type.id"

    - step: "Create interest account"
      action: "create"
      model: "account.account"
      save_as: "account_interest"
      values:
        code: "EVAL: 'LOINT%d' % env['account.account'].search_count([])"
        name: "Test Loan Out Interest Account"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create interest income account"
      action: "create"
      model: "account.account"
      save_as: "account_interest_income"
      values:
        code: "EVAL: 'LOINC%d' % env['account.account'].search_count([])"
        name: "Test Loan Out Interest Income Account"
        user_type_id: "REC: revenue_acc_type.id"

    - step: "Create realization journal"
      action: "create"
      model: "account.journal"
      save_as: "realization_journal"
      values:
        name:
          "EVAL: 'Test Loan Out Realization Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'OJ%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create interest journal"
      action: "create"
      model: "account.journal"
      save_as: "interest_journal"
      values:
        name:
          "EVAL: 'Test Loan Out Interest Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'OK%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create flat interest loan type"
      action: "create"
      model: "loan.type"
      save_as: "loan_type_flat_out"
      values:
        name: "Test Flat Loan Out"
        code: "/"
        direction: "out"
        interest_method: "flat"
        currency_id: "REF: base.USD"
        interest_amount: 3.0
        maximum_loan_amount: 6000.0
        maximum_installment_period: 12
        realization_journal_id: "REC: realization_journal.id"
        account_realization_id: "REC: account_realization.id"
        account_rounding_id: "REC: account_rounding.id"
        interest_journal_id: "REC: interest_journal.id"
        account_interest_id: "REC: account_interest.id"
        account_interest_income_id: "REC: account_interest_income.id"

    - step: "Create anuity interest loan type"
      action: "create"
      model: "loan.type"
      save_as: "loan_type_anuity_out"
      values:
        name: "Test Anuity Loan Out"
        code: "/"
        direction: "out"
        interest_method: "anuity"
        currency_id: "REF: base.USD"
        interest_amount: 3.0
        maximum_loan_amount: 6000.0
        maximum_installment_period: 12
        realization_journal_id: "REC: realization_journal.id"
        account_realization_id: "REC: account_realization.id"
        account_rounding_id: "REC: account_rounding.id"
        interest_journal_id: "REC: interest_journal.id"
        account_interest_id: "REC: account_interest.id"
        account_interest_income_id: "REC: account_interest_income.id"

    - step: "Create effective interest loan type"
      action: "create"
      model: "loan.type"
      save_as: "loan_type_effective_out"
      values:
        name: "Test Effective Loan Out"
        code: "/"
        direction: "out"
        interest_method: "effective"
        currency_id: "REF: base.USD"
        interest_amount: 3.0
        maximum_loan_amount: 6000.0
        maximum_installment_period: 12
        realization_journal_id: "REC: realization_journal.id"
        account_realization_id: "REC: account_realization.id"
        account_rounding_id: "REC: account_rounding.id"
        interest_journal_id: "REC: interest_journal.id"
        account_interest_id: "REC: account_interest.id"
        account_interest_income_id: "REC: account_interest_income.id"

scenarios:
  - name: "Loan Out - Flat interest workflow"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Loan Out Partner"
          is_company: false

      - step: "Create loan.out with flat interest type"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_flat"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Assert loan.out created in draft"
        action: "assert"
        target: "loan_out_flat"
        asserts:
          state:
            type: "value"
            expected: "draft"
          loan_amount:
            type: "value"
            expected: 3000.0
          manual_loan_period:
            type: "value"
            expected: 6

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_out_flat"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert payment schedules generated"
        action: "assert"
        target: "loan_out_flat"
        asserts:
          total_principle_amount:
            type: "value"
            expected: 3000.0

      - step: "Confirm loan.out"
        action: "call"
        target: "loan_out_flat"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.out is confirmed"
        action: "assert"
        target: "loan_out_flat"
        asserts:
          state:
            type: "value"
            expected: "confirm"

  - name: "Loan Out - Anuity interest workflow"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_anuity"
        values:
          name: "Test Loan Out Anuity Partner"

      - step: "Create loan.out with anuity type"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_anuity"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_anuity.id"
          type_id: "REC: loan_type_anuity_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 4000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 12
          first_payment_date: "2024-02-01"

      - step: "Compute anuity payment"
        action: "call"
        target: "loan_out_anuity"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert anuity loan created"
        action: "assert"
        target: "loan_out_anuity"
        asserts:
          state:
            type: "value"
            expected: "draft"
          loan_amount:
            type: "value"
            expected: 4000.0

  - name: "Loan Out - Effective interest workflow"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_eff"
        values:
          name: "Test Loan Out Effective Partner"

      - step: "Create loan.out with effective type"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_eff"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_eff.id"
          type_id: "REC: loan_type_effective_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 2400.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute effective payment"
        action: "call"
        target: "loan_out_eff"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Confirm effective loan.out"
        action: "call"
        target: "loan_out_eff"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert effective loan confirmed"
        action: "assert"
        target: "loan_out_eff"
        asserts:
          state:
            type: "value"
            expected: "confirm"

  - name: "Loan Out - onchange type_id fills and resets derived fields"
    steps:
      - step: "Fill type_id on a new loan.out form"
        action: "form"
        model: "loan.out"
        save: false
        ops:
          - set: {type_id: "REC: loan_type_flat_out"}
          - assert:
              maximum_loan_amount:
                type: "value"
                expected: 6000.0
              maximum_installment_period:
                type: "value"
                expected: 12
              interest:
                type: "value"
                expected: 3.0
          # Odoo's Form.__setattr__ requires an empty recordset of the
          # right model to clear a many2one -- plain `false` fails its
          # own `isinstance(value, BaseModel)` assertion, it is not a
          # no-op.
          - set: {type_id: "EVAL: env['loan.type']"}
          - assert:
              maximum_loan_amount:
                type: "value"
                expected: 0.0
              maximum_installment_period:
                type: "value"
                expected: 0
              interest:
                type: "value"
                expected: 0.0

  - name: "Loan Out - confirm rejected when schedule not computed"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_no_schedule"
        values:
          name: "Test Loan Out No Schedule Partner"

      - step: "Create loan.out without computing payment schedule"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_no_schedule"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_no_schedule.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Confirm without computed schedule is rejected"
        action: "call"
        target: "loan_out_no_schedule"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        expect_error:
          type: "ValidationError"
          message_contains: "different with loan amount"

      - step: "Assert loan.out stays draft"
        action: "assert"
        target: "loan_out_no_schedule"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Loan Out - confirm rejected when loan amount exceeds type maximum"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_over_limit"
        values:
          name: "Test Loan Out Over Limit Partner"

      - step: "Create loan.out with amount above the type maximum"
        action: "create"
        model: "loan.out"
        save_as: "loan_out_over_limit"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_over_limit.id"
          type_id: "REC: loan_type_flat_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 7000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_out_over_limit"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert schedule matches loan amount"
        action: "assert"
        target: "loan_out_over_limit"
        asserts:
          total_principle_amount:
            type: "value"
            expected: 7000.0

      - step: "Confirm above maximum loan amount is rejected"
        action: "call"
        target: "loan_out_over_limit"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        expect_error:
          type: "ValidationError"
          message_contains: "cannot exceed the maximum total loan"

      - step: "Assert loan.out stays draft"
        action: "assert"
        target: "loan_out_over_limit"
        asserts:
          state:
            type: "value"
            expected: "draft"
