options:
  auto_refresh: true

setup:
  steps:
    - step: "Get payable account type"
      action: "ref"
      xml_id: "account.data_account_type_payable"
      save_as: "payable_acc_type"

    - step: "Get expense account type"
      action: "ref"
      xml_id: "account.data_account_type_expenses"
      save_as: "expense_acc_type"

    # `setup:` replays before every scenario in the same transaction (no
    # rollback in between), so a fixed `code` would collide with the
    # previous scenario's record on the 2nd+ replay (code is unique per
    # company). Generate a fresh, never-colliding code on each replay.
    - step: "Create realization account"
      action: "create"
      model: "account.account"
      save_as: "account_realization"
      values:
        code: "EVAL: 'LIREAL%d' % env['account.account'].search_count([])"
        name: "Test Loan In Realization Account"
        user_type_id: "REC: payable_acc_type.id"
        reconcile: true

    - step: "Create rounding account"
      action: "create"
      model: "account.account"
      save_as: "account_rounding"
      values:
        code: "EVAL: 'LIROUND%d' % env['account.account'].search_count([])"
        name: "Test Loan In Rounding Account"
        user_type_id: "REC: expense_acc_type.id"

    - step: "Create interest account"
      action: "create"
      model: "account.account"
      save_as: "account_interest"
      values:
        code: "EVAL: 'LIINT%d' % env['account.account'].search_count([])"
        name: "Test Loan In Interest Account"
        user_type_id: "REC: payable_acc_type.id"
        reconcile: true

    - step: "Create interest expense account"
      action: "create"
      model: "account.account"
      save_as: "account_interest_income"
      values:
        code: "EVAL: 'LIINC%d' % env['account.account'].search_count([])"
        name: "Test Loan In Interest Expense Account"
        user_type_id: "REC: expense_acc_type.id"

    - step: "Create realization journal"
      action: "create"
      model: "account.journal"
      save_as: "realization_journal"
      values:
        name:
          "EVAL: 'Test Loan In Realization Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'IJ%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create interest journal"
      action: "create"
      model: "account.journal"
      save_as: "interest_journal"
      values:
        name:
          "EVAL: 'Test Loan In Interest Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'IK%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create flat interest loan type"
      action: "create"
      model: "loan.type"
      save_as: "loan_type_flat_in"
      values:
        name: "Test Flat Loan In"
        code: "/"
        direction: "in"
        interest_method: "flat"
        currency_id: "REF: base.USD"
        interest_amount: 3.0
        maximum_loan_amount: 6000.0
        maximum_installment_period: 12
        realization_journal_id: "REC: realization_journal.id"
        account_realization_id: "REC: account_realization.id"
        account_rounding_id: "REC: account_rounding.id"
        interest_journal_id: "REC: interest_journal.id"
        account_interest_id: "REC: account_interest.id"
        account_interest_income_id: "REC: account_interest_income.id"
        short_account_principle_id: "REC: account_realization.id"
        long_account_principle_id: "REC: account_realization.id"

    - step: "Create anuity interest loan type"
      action: "create"
      model: "loan.type"
      save_as: "loan_type_anuity_in"
      values:
        name: "Test Anuity Loan In"
        code: "/"
        direction: "in"
        interest_method: "anuity"
        currency_id: "REF: base.USD"
        interest_amount: 3.0
        maximum_loan_amount: 6000.0
        maximum_installment_period: 12
        realization_journal_id: "REC: realization_journal.id"
        account_realization_id: "REC: account_realization.id"
        account_rounding_id: "REC: account_rounding.id"
        interest_journal_id: "REC: interest_journal.id"
        account_interest_id: "REC: account_interest.id"
        account_interest_income_id: "REC: account_interest_income.id"
        short_account_principle_id: "REC: account_realization.id"
        long_account_principle_id: "REC: account_realization.id"

    - step: "Create effective interest loan type"
      action: "create"
      model: "loan.type"
      save_as: "loan_type_effective_in"
      values:
        name: "Test Effective Loan In"
        code: "/"
        direction: "in"
        interest_method: "effective"
        currency_id: "REF: base.USD"
        interest_amount: 3.0
        maximum_loan_amount: 6000.0
        maximum_installment_period: 12
        realization_journal_id: "REC: realization_journal.id"
        account_realization_id: "REC: account_realization.id"
        account_rounding_id: "REC: account_rounding.id"
        interest_journal_id: "REC: interest_journal.id"
        account_interest_id: "REC: account_interest.id"
        account_interest_income_id: "REC: account_interest_income.id"

    # ssi_loan ships a "Standard" approval.template for loan.in (sequence 100,
    # always matches) whose approver group is ssi_loan.loan_in_validator_group
    # -- action_reject_approval/action_approve_approval only flip state for a
    # user in that template's resolved approver_user_ids, so base.user_admin
    # must be a member for the reject/approve scenarios below to take effect.
    - step: "Get base.user_admin"
      action: "ref"
      xml_id: "base.user_admin"
      save_as: "admin_user"

    - step: "Add admin to the loan.in validator group"
      action: "write"
      target: "admin_user"
      values:
        groups_id: [[4, "REF: ssi_loan.loan_in_validator_group"]]

scenarios:
  - name: "Loan In - Flat interest workflow"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in"
        values:
          name: "Test Loan In Partner"
          is_company: false

      - step: "Create loan.in with flat interest type"
        action: "create"
        model: "loan.in"
        save_as: "loan_in_flat"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_in.id"
          type_id: "REC: loan_type_flat_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 2400.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Assert loan.in created in draft"
        action: "assert"
        target: "loan_in_flat"
        asserts:
          state:
            type: "value"
            expected: "draft"
          loan_amount:
            type: "value"
            expected: 2400.0
          manual_loan_period:
            type: "value"
            expected: 6

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_in_flat"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert payment schedules generated"
        action: "assert"
        target: "loan_in_flat"
        asserts:
          total_principle_amount:
            type: "value"
            expected: 2400.0

      - step: "Confirm loan.in"
        action: "call"
        target: "loan_in_flat"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.in is confirmed"
        action: "assert"
        target: "loan_in_flat"
        asserts:
          state:
            type: "value"
            expected: "confirm"

  - name: "Loan In - Anuity interest workflow"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in_anuity"
        values:
          name: "Test Loan In Anuity Partner"

      - step: "Create loan.in with anuity type"
        action: "create"
        model: "loan.in"
        save_as: "loan_in_anuity"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_in_anuity.id"
          type_id: "REC: loan_type_anuity_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 12
          first_payment_date: "2024-02-01"

      - step: "Compute anuity payment"
        action: "call"
        target: "loan_in_anuity"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert anuity loan.in created"
        action: "assert"
        target: "loan_in_anuity"
        asserts:
          state:
            type: "value"
            expected: "draft"
          loan_amount:
            type: "value"
            expected: 3000.0

  - name: "Loan In - onchange type_id fills and resets derived fields"
    steps:
      - step: "Fill type_id on a new loan.in form"
        action: "form"
        model: "loan.in"
        save: false
        ops:
          - set: {type_id: "REC: loan_type_flat_in"}
          - assert:
              maximum_loan_amount:
                type: "value"
                expected: 6000.0
              maximum_installment_period:
                type: "value"
                expected: 12
              interest:
                type: "value"
                expected: 3.0
          # Odoo's Form.__setattr__ requires an empty recordset of the
          # right model to clear a many2one -- plain `false` fails its
          # own `isinstance(value, BaseModel)` assertion, it is not a
          # no-op.
          - set: {type_id: "EVAL: env['loan.type']"}
          - assert:
              maximum_loan_amount:
                type: "value"
                expected: 0.0
              maximum_installment_period:
                type: "value"
                expected: 0
              interest:
                type: "value"
                expected: 0.0

  - name: "Loan In - confirm rejected when schedule not computed"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in_no_schedule"
        values:
          name: "Test Loan In No Schedule Partner"

      - step: "Create loan.in without computing payment schedule"
        action: "create"
        model: "loan.in"
        save_as: "loan_in_no_schedule"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_in_no_schedule.id"
          type_id: "REC: loan_type_flat_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 2400.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Confirm without computed schedule is rejected"
        action: "call"
        target: "loan_in_no_schedule"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        expect_error:
          type: "ValidationError"
          message_contains: "different with loan amount"

      - step: "Assert loan.in stays draft"
        action: "assert"
        target: "loan_in_no_schedule"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Loan In - confirm rejected when loan amount exceeds type maximum"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in_over_limit"
        values:
          name: "Test Loan In Over Limit Partner"

      - step: "Create loan.in with amount above the type maximum"
        action: "create"
        model: "loan.in"
        save_as: "loan_in_over_limit"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_in_over_limit.id"
          type_id: "REC: loan_type_flat_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 7200.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_in_over_limit"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert schedule matches loan amount"
        action: "assert"
        target: "loan_in_over_limit"
        asserts:
          total_principle_amount:
            type: "value"
            expected: 7200.0

      - step: "Confirm above maximum loan amount is rejected"
        action: "call"
        target: "loan_in_over_limit"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        expect_error:
          type: "ValidationError"
          message_contains: "cannot exceed the maximum total loan"

      - step: "Assert loan.in stays draft"
        action: "assert"
        target: "loan_in_over_limit"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Loan In - aggregate compute fields are empty before schedule is computed"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in_empty"
        values:
          name: "Test Loan In Empty Partner"

      - step: "Create loan.in without computing payment schedule"
        action: "create"
        model: "loan.in"
        save_as: "loan_in_empty"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_in_empty.id"
          type_id: "REC: loan_type_flat_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 6000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Assert all aggregates are empty"
        action: "assert"
        target: "loan_in_empty"
        asserts:
          total_principle_amount:
            type: "value"
            expected: 0.0
          total_interest_amount:
            type: "value"
            expected: 0.0
          total_manual_principle_amount:
            type: "value"
            expected: 0.0
          paid:
            type: "value"
            expected: false
          realized:
            type: "value"
            expected: false

  - name: "Loan In - aggregate compute fields after schedule is computed"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in_normal"
        values:
          name: "Test Loan In Normal Partner"

      - step: "Create loan.in with an evenly-divisible flat schedule"
        action: "create"
        model: "loan.in"
        save_as: "loan_in_normal"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_in_normal.id"
          type_id: "REC: loan_type_flat_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 6000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_in_normal"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert aggregates match the flat schedule"
        action: "assert"
        target: "loan_in_normal"
        asserts:
          total_principle_amount:
            type: "value"
            expected: 6000.0
          total_manual_principle_amount:
            type: "value"
            expected: 0.0
          total_interest_amount:
            type: "value"
            expected: 90.0
          paid:
            type: "value"
            expected: false

  - name: "Loan In - manual schedule moves principle out of the auto-reconciled total"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in_manual"
        values:
          name: "Test Loan In Manual Partner"

      - step: "Create loan.in with an evenly-divisible flat schedule"
        action: "create"
        model: "loan.in"
        save_as: "loan_in_manual"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_in_manual.id"
          type_id: "REC: loan_type_flat_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 6000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_in_manual"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Find the 3rd installment by loan_id and schedule_date"
        action: "search"
        model: "loan.payment_schedule_in"
        domain:
          - ["loan_id", "=", "REC: loan_in_manual.id"]
          - ["schedule_date", "=", "2024-04-01"]
        save_as: "schedule_row_in_manual"
        expect_count: 1

      - step: "Mark the found installment as manually controlled"
        action: "write"
        target: "schedule_row_in_manual"
        values:
          principle_payment_state: "manual"

      - step: "Assert principle moved to the manual total, interest unchanged"
        action: "assert"
        target: "loan_in_manual"
        asserts:
          total_manual_principle_amount:
            type: "value"
            expected: 1000.0
          total_principle_amount:
            type: "value"
            expected: 5000.0
          total_interest_amount:
            type: "value"
            expected: 90.0

  - name: "Loan In - approval moves the loan to ready and posts the realization move"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in_ready"
        values:
          name: "Test Loan In Ready Partner"

      - step: "Create loan.in with an evenly-divisible flat schedule"
        action: "create"
        model: "loan.in"
        save_as: "loan_in_ready"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_in_ready.id"
          type_id: "REC: loan_type_flat_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 6000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_in_ready"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Confirm loan.in"
        action: "call"
        target: "loan_in_ready"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Approve loan.in"
        action: "call"
        target: "loan_in_ready"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.in is ready with a posted realization move"
        action: "assert"
        target: "loan_in_ready"
        asserts:
          state:
            type: "value"
            expected: "ready"
          move_realization_id:
            type: "value"
            operator: "is_truthy"
          move_line_header_id:
            type: "value"
            operator: "is_truthy"
          move_realization_id.state:
            type: "value"
            expected: "posted"

  - name: "Loan In - rejection followed by restart back to draft"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in_reject"
        values:
          name: "Test Loan In Reject Partner"

      - step: "Create loan.in with an evenly-divisible flat schedule"
        action: "create"
        model: "loan.in"
        save_as: "loan_in_reject"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_in_reject.id"
          type_id: "REC: loan_type_flat_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 6000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_in_reject"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Confirm loan.in"
        action: "call"
        target: "loan_in_reject"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Reject loan.in"
        action: "call"
        target: "loan_in_reject"
        method: "action_reject_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      # TEMP DIAGNOSTIC (to be removed) -- narrows down why the assert below
      # fails: does action_reject_approval's own approval.approval record
      # actually flip to status=rejected (meaning user_approves matched but
      # something *else* reverts loan.in.state afterward), or does it stay
      # pending (meaning user_approves was empty despite the group fix that
      # already makes the sibling "approve" scenario pass)?
      - step: "DIAG: count active_approval_ids on the document itself"
        action: "assert"
        target: "loan_in_reject"
        refresh: true
        asserts:
          active_approval_ids:
            type: "m2m"
            check: "count"
            expected_count: 1

      - step: "DIAG: find this loan.in's approval.approval record"
        action: "search"
        model: "approval.approval"
        domain:
          - ["model", "=", "loan.in"]
          - ["res_id", "=", "REC: loan_in_reject.id"]
        save_as: "diag_reject_approval"
        expect_count: 1

      - step: "DIAG: assert approver_user_ids contains admin"
        action: "assert"
        target: "diag_reject_approval"
        asserts:
          approver_user_ids:
            type: "m2m"
            check: "contains_xml_ids"
            expected_xml_ids:
              - "base.user_admin"

      - step: "Assert loan.in is rejected"
        action: "assert"
        target: "loan_in_reject"
        asserts:
          state:
            type: "value"
            expected: "reject"

      - step: "Restart rejected loan.in"
        action: "call"
        target: "loan_in_reject"
        method: "action_restart"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.in is back to draft"
        action: "assert"
        target: "loan_in_reject"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Loan In - cancel from ready via wizard removes the realization move"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in_cancel"
        values:
          name: "Test Loan In Cancel Partner"

      - step: "Create loan.in with an evenly-divisible flat schedule"
        action: "create"
        model: "loan.in"
        save_as: "loan_in_cancel"
        values:
          date: "2024-01-01"
          partner_id: "REC: partner_in_cancel.id"
          type_id: "REC: loan_type_flat_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 6000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"

      - step: "Compute payment schedules"
        action: "call"
        target: "loan_in_cancel"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Confirm loan.in"
        action: "call"
        target: "loan_in_cancel"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Approve loan.in"
        action: "call"
        target: "loan_in_cancel"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.in is ready before cancelling"
        action: "assert"
        target: "loan_in_cancel"
        asserts:
          state:
            type: "value"
            expected: "ready"
          name:
            type: "value"
            operator: "is_truthy"

      - step: "Create a dedicated cancel reason for this scenario"
        action: "create"
        model: "base.cancel_reason"
        save_as: "cancel_reason_in"
        values:
          name: "Test Loan In Cancel Reason"
          code: "TEST-CANCEL-LOAN-IN"

      - step: "Cancel the ready loan.in via the select-cancel-reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "loan_in_cancel"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        values:
          cancel_reason_id: "REC: cancel_reason_in"
        method: "action_confirm"

      # Asserted as a separate plain `assert` step, not inline on the wizard
      # step above: the wizard action's own inline `asserts:` rebinds
      # `target` to the `as_user` env just for that read, which forces an
      # uncached fetch that pulls in this env's whole loan.in prefetch set
      # (every loan.in id touched so far by earlier scenarios in this same
      # transaction) and trips the "user_id = user.id" record rule on
      # sibling ids that were never created by base.user_admin. A plain
      # `assert` step reads through the base test env instead, matching
      # every other post-action assertion in this file.
      - step: "Assert loan.in is cancelled and realization move/header cleared"
        action: "assert"
        target: "loan_in_cancel"
        asserts:
          state:
            type: "value"
            expected: "cancel"
          cancel_reason_id:
            type: "m2o"
            expected: "REC: cancel_reason_in"
          move_realization_id:
            type: "value"
            operator: "is_falsy"
          move_line_header_id:
            type: "value"
            operator: "is_falsy"

      - step: "Assert the realization move no longer exists"
        action: "search"
        model: "account.move"
        domain:
          - ["ref", "=", "REC: loan_in_cancel.name"]
        save_as: "deleted_realization_move_in"
        expect_count: 0
