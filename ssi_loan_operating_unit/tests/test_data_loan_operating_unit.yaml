options:
  auto_refresh: true

setup:
  steps:
    - step: "Get receivable account type"
      action: "ref"
      xml_id: "account.data_account_type_receivable"
      save_as: "receivable_acc_type"

    - step: "Get revenue account type"
      action: "ref"
      xml_id: "account.data_account_type_revenue"
      save_as: "revenue_acc_type"

    - step: "Get payable account type"
      action: "ref"
      xml_id: "account.data_account_type_payable"
      save_as: "payable_acc_type"

    - step: "Get expense account type"
      action: "ref"
      xml_id: "account.data_account_type_expenses"
      save_as: "expense_acc_type"

    # `setup:` replays before every scenario in the same transaction (no
    # rollback in between), so a fixed `code`/`login` would collide with
    # the previous scenario's record on the 2nd+ replay (unique per
    # company, or globally for `res.users.login`). Generate a fresh,
    # never-colliding value on each replay.
    - step: "Create loan out realization account"
      action: "create"
      model: "account.account"
      save_as: "account_realization_out"
      values:
        code: "EVAL: 'LOUREAL%d' % env['account.account'].search_count([])"
        name: "Test Loan OU Out Realization Account"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create loan out rounding account"
      action: "create"
      model: "account.account"
      save_as: "account_rounding_out"
      values:
        code: "EVAL: 'LOUROUND%d' % env['account.account'].search_count([])"
        name: "Test Loan OU Out Rounding Account"
        user_type_id: "REC: revenue_acc_type.id"

    - step: "Create loan out interest account"
      action: "create"
      model: "account.account"
      save_as: "account_interest_out"
      values:
        code: "EVAL: 'LOUINT%d' % env['account.account'].search_count([])"
        name: "Test Loan OU Out Interest Account"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create loan out interest income account"
      action: "create"
      model: "account.account"
      save_as: "account_interest_income_out"
      values:
        code: "EVAL: 'LOUINC%d' % env['account.account'].search_count([])"
        name: "Test Loan OU Out Interest Income Account"
        user_type_id: "REC: revenue_acc_type.id"

    - step: "Create loan out realization journal"
      action: "create"
      model: "account.journal"
      save_as: "realization_journal_out"
      values:
        name:
          "EVAL: 'Test Loan OU Out Realization Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'LOUJ%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create loan out interest journal"
      action: "create"
      model: "account.journal"
      save_as: "interest_journal_out"
      values:
        name:
          "EVAL: 'Test Loan OU Out Interest Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'LOUK%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create out short principle account"
      action: "create"
      model: "account.account"
      save_as: "account_principle_short_out"
      values:
        code: "EVAL: 'LOUPSO%d' % env['account.account'].search_count([])"
        name: "Test Loan OU out short principle account"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create out long principle account"
      action: "create"
      model: "account.account"
      save_as: "account_principle_long_out"
      values:
        code: "EVAL: 'LOUPLO%d' % env['account.account'].search_count([])"
        name: "Test Loan OU out long principle account"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create in short principle account"
      action: "create"
      model: "account.account"
      save_as: "account_principle_short_in"
      values:
        code: "EVAL: 'LOUPSI%d' % env['account.account'].search_count([])"
        name: "Test Loan OU in short principle account"
        user_type_id: "REC: payable_acc_type.id"
        reconcile: true

    - step: "Create in long principle account"
      action: "create"
      model: "account.account"
      save_as: "account_principle_long_in"
      values:
        code: "EVAL: 'LOUPLI%d' % env['account.account'].search_count([])"
        name: "Test Loan OU in long principle account"
        user_type_id: "REC: payable_acc_type.id"
        reconcile: true

    - step: "Create loan out type"
      action: "create"
      model: "loan.type"
      save_as: "loan_type_out"
      values:
        name: "Test Loan OU Out Type"
        code: "/"
        direction: "out"
        interest_method: "flat"
        currency_id: "REF: base.USD"
        interest_amount: 3.0
        maximum_loan_amount: 6000.0
        maximum_installment_period: 12
        realization_journal_id: "REC: realization_journal_out.id"
        account_realization_id: "REC: account_realization_out.id"
        account_rounding_id: "REC: account_rounding_out.id"
        interest_journal_id: "REC: interest_journal_out.id"
        account_interest_id: "REC: account_interest_out.id"
        account_interest_income_id: "REC: account_interest_income_out.id"
        short_account_principle_id: "REC: account_principle_short_out.id"
        long_account_principle_id: "REC: account_principle_long_out.id"

    - step: "Create loan in realization account"
      action: "create"
      model: "account.account"
      save_as: "account_realization_in"
      values:
        code: "EVAL: 'LIUREAL%d' % env['account.account'].search_count([])"
        name: "Test Loan OU In Realization Account"
        user_type_id: "REC: payable_acc_type.id"
        reconcile: true

    - step: "Create loan in rounding account"
      action: "create"
      model: "account.account"
      save_as: "account_rounding_in"
      values:
        code: "EVAL: 'LIUROUND%d' % env['account.account'].search_count([])"
        name: "Test Loan OU In Rounding Account"
        user_type_id: "REC: expense_acc_type.id"

    - step: "Create loan in interest account"
      action: "create"
      model: "account.account"
      save_as: "account_interest_in"
      values:
        code: "EVAL: 'LIUINT%d' % env['account.account'].search_count([])"
        name: "Test Loan OU In Interest Account"
        user_type_id: "REC: payable_acc_type.id"
        reconcile: true

    - step: "Create loan in interest expense account"
      action: "create"
      model: "account.account"
      save_as: "account_interest_income_in"
      values:
        code: "EVAL: 'LIUINC%d' % env['account.account'].search_count([])"
        name: "Test Loan OU In Interest Expense Account"
        user_type_id: "REC: expense_acc_type.id"

    - step: "Create loan in realization journal"
      action: "create"
      model: "account.journal"
      save_as: "realization_journal_in"
      values:
        name:
          "EVAL: 'Test Loan OU In Realization Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'LIUJ%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create loan in interest journal"
      action: "create"
      model: "account.journal"
      save_as: "interest_journal_in"
      values:
        name:
          "EVAL: 'Test Loan OU In Interest Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'LIUK%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create loan in type"
      action: "create"
      model: "loan.type"
      save_as: "loan_type_in"
      values:
        name: "Test Loan OU In Type"
        code: "/"
        direction: "in"
        interest_method: "flat"
        currency_id: "REF: base.USD"
        interest_amount: 2.0
        maximum_loan_amount: 10000.0
        maximum_installment_period: 12
        realization_journal_id: "REC: realization_journal_in.id"
        account_realization_id: "REC: account_realization_in.id"
        account_rounding_id: "REC: account_rounding_in.id"
        interest_journal_id: "REC: interest_journal_in.id"
        account_interest_id: "REC: account_interest_in.id"
        account_interest_income_id: "REC: account_interest_income_in.id"
        short_account_principle_id: "REC: account_principle_short_in.id"
        long_account_principle_id: "REC: account_principle_long_in.id"

    - step: "Create partner for operating unit A"
      action: "create"
      model: "res.partner"
      save_as: "ou_a_partner"
      values:
        name: "Test Loan OU-A Partner"

    - step: "Create operating unit A"
      action: "create"
      model: "operating.unit"
      save_as: "ou_a"
      values:
        name: "EVAL: 'Test Loan OU-A %d' % env['operating.unit'].search_count([])"
        code: "EVAL: 'LOUA%d' % env['operating.unit'].search_count([])"
        partner_id: "REC: ou_a_partner.id"

    - step: "Create partner for operating unit B"
      action: "create"
      model: "res.partner"
      save_as: "ou_b_partner"
      values:
        name: "Test Loan OU-B Partner"

    - step: "Create operating unit B"
      action: "create"
      model: "operating.unit"
      save_as: "ou_b"
      values:
        name: "EVAL: 'Test Loan OU-B %d' % env['operating.unit'].search_count([])"
        code: "EVAL: 'LOUB%d' % env['operating.unit'].search_count([])"
        partner_id: "REC: ou_b_partner.id"

    - step: "Create user assigned to operating unit A"
      action: "create"
      model: "res.users"
      save_as: "user_a"
      values:
        name: "Loan OU-A Rule User"
        login: "EVAL: 'loan_ou_a_rule_user_%d' % env['res.users'].search_count([])"
        groups_id:
          - - 6
            - 0
            - - "REF: base.group_user"
              - "REF: ssi_loan.loan_out_user_group"
              - "REF: ssi_loan.loan_in_user_group"
              - "REF: ssi_loan_operating_unit.loan_out_ou_group"
              - "REF: ssi_loan_operating_unit.loan_in_ou_group"
        assigned_operating_unit_ids:
          - - 6
            - 0
            - - "REC: ou_a.id"

    - step: "Create user assigned to operating unit B"
      action: "create"
      model: "res.users"
      save_as: "user_b"
      values:
        name: "Loan OU-B Rule User"
        login: "EVAL: 'loan_ou_b_rule_user_%d' % env['res.users'].search_count([])"
        groups_id:
          - - 6
            - 0
            - - "REF: base.group_user"
              - "REF: ssi_loan.loan_out_user_group"
              - "REF: ssi_loan.loan_in_user_group"
              - "REF: ssi_loan_operating_unit.loan_out_ou_group"
              - "REF: ssi_loan_operating_unit.loan_in_ou_group"
        assigned_operating_unit_ids:
          - - 6
            - 0
            - - "REC: ou_b.id"

    # Additional item fixture used by the journal propagation scenarios.
    - step: "Create additional item receivable account"
      action: "create"
      model: "account.account"
      save_as: "ai_receivable_account"
      values:
        code: "EVAL: 'LOUAIR%d' % env['account.account'].search_count([])"
        name: "Test Loan OU Additional Item Receivable Account"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create additional item contra-receivable account"
      action: "create"
      model: "account.account"
      save_as: "ai_contra_receivable_account"
      values:
        code: "EVAL: 'LOUAICR%d' % env['account.account'].search_count([])"
        name: "Test Loan OU Additional Item Contra-Receivable Account"
        user_type_id: "REC: revenue_acc_type.id"

    - step: "Create additional item payable account"
      action: "create"
      model: "account.account"
      save_as: "ai_payable_account"
      values:
        code: "EVAL: 'LOUAIP%d' % env['account.account'].search_count([])"
        name: "Test Loan OU Additional Item Payable Account"
        user_type_id: "REC: payable_acc_type.id"
        reconcile: true

    - step: "Create additional item contra-payable account"
      action: "create"
      model: "account.account"
      save_as: "ai_contra_payable_account"
      values:
        code: "EVAL: 'LOUAICP%d' % env['account.account'].search_count([])"
        name: "Test Loan OU Additional Item Contra-Payable Account"
        user_type_id: "REC: expense_acc_type.id"

    - step: "Create additional item receivable journal"
      action: "create"
      model: "account.journal"
      save_as: "ai_receivable_journal"
      values:
        name:
          "EVAL: 'Test Loan OU Additional Item Receivable Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'LOUAJR%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create additional item payable journal"
      action: "create"
      model: "account.journal"
      save_as: "ai_payable_journal"
      values:
        name:
          "EVAL: 'Test Loan OU Additional Item Payable Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'LOUAJP%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create additional item usable on both directions"
      action: "create"
      model: "loan.additional_item"
      save_as: "additional_item"
      values:
        name: "Test Loan OU Additional Item"
        code: "/"
        loan_out_ok: true
        loan_in_ok: true
        receivable_journal_id: "REC: ai_receivable_journal.id"
        receivable_account_id: "REC: ai_receivable_account.id"
        contra_receivable_account_id: "REC: ai_contra_receivable_account.id"
        payable_journal_id: "REC: ai_payable_journal.id"
        payable_account_id: "REC: ai_payable_account.id"
        contra_payable_account_id: "REC: ai_contra_payable_account.id"

scenarios:
  - name: "Loan Out - Operating Unit propagation"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Loan OU Partner"
          is_company: false

      - step: "Create loan.out with operating_unit_id"
        action: "create"
        model: "loan.out"
        save_as: "loan_out"
        values:
          date: "2024-01-01"
          partner_id: "EVAL: registry['partner'].id"
          type_id: "REC: loan_type_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Assert loan.out operating_unit_id is set"
        action: "assert"
        target: "loan_out"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "Loan In - Operating Unit propagation"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in"
        values:
          name: "Test Loan In OU Partner"
          is_company: true

      - step: "Create loan.in with operating_unit_id"
        action: "create"
        model: "loan.in"
        save_as: "loan_in"
        values:
          date: "2024-01-01"
          partner_id: "EVAL: registry['partner_in'].id"
          type_id: "REC: loan_type_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 5000.0
          maximum_loan_amount: 10000.0
          interest: 2.0
          manual_loan_period: 12
          first_payment_date: "2024-02-01"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Assert loan.in operating_unit_id is set"
        action: "assert"
        target: "loan_in"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "Loan Out - Operating unit record rule scopes visibility"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "out_rule_partner"
        values:
          name: "Test Loan Out OU Rule Partner"
          is_company: false

      - step: "Create loan.out scoped to operating unit A, owned by a third user"
        action: "create"
        model: "loan.out"
        save_as: "out_rule_loan"
        values:
          date: "2024-01-01"
          partner_id: "REC: out_rule_partner.id"
          type_id: "REC: loan_type_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"
          operating_unit_id: "REC: ou_a.id"
          user_id: "REF: base.user_admin"

      - step: "Loan is scoped to operating unit A"
        action: "assert"
        target: "out_rule_loan"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou_a"

      - step: "Truth gate: the document owner is neither of the two test users"
        action: "assert"
        target: "out_rule_loan"
        asserts:
          user_id:
            type: "m2o"
            expected_xml_id: "base.user_admin"

      - step: "User of a different operating unit cannot see it"
        action: "search"
        model: "loan.out"
        as_user: "user_b"
        domain:
          - ["id", "=", "REC: out_rule_loan.id"]
        save_as: "out_seen_by_b"
        expect_count: 0

      - step: "User of the same operating unit can see it"
        action: "search"
        model: "loan.out"
        as_user: "user_a"
        domain:
          - ["id", "=", "REC: out_rule_loan.id"]
        save_as: "out_seen_by_a"
        expect_count: 1

  - name: "Loan In - Operating unit record rule scopes visibility"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "in_rule_partner"
        values:
          name: "Test Loan In OU Rule Partner"
          is_company: true

      - step: "Create loan.in scoped to operating unit B, owned by a third user"
        action: "create"
        model: "loan.in"
        save_as: "in_rule_loan"
        values:
          date: "2024-01-01"
          partner_id: "REC: in_rule_partner.id"
          type_id: "REC: loan_type_in.id"
          currency_id: "REF: base.USD"
          loan_amount: 5000.0
          maximum_loan_amount: 10000.0
          interest: 2.0
          manual_loan_period: 12
          first_payment_date: "2024-02-01"
          operating_unit_id: "REC: ou_b.id"
          user_id: "REF: base.user_admin"

      - step: "Loan is scoped to operating unit B"
        action: "assert"
        target: "in_rule_loan"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou_b"

      - step: "Truth gate: the document owner is neither of the two test users"
        action: "assert"
        target: "in_rule_loan"
        asserts:
          user_id:
            type: "m2o"
            expected_xml_id: "base.user_admin"

      - step: "User of a different operating unit cannot see it"
        action: "search"
        model: "loan.in"
        as_user: "user_a"
        domain:
          - ["id", "=", "REC: in_rule_loan.id"]
        save_as: "in_seen_by_a"
        expect_count: 0

      - step: "User of the same operating unit can see it"
        action: "search"
        model: "loan.in"
        as_user: "user_b"
        domain:
          - ["id", "=", "REC: in_rule_loan.id"]
        save_as: "in_seen_by_b"
        expect_count: 1

  - name: "Loan Out - Realization journal carries the loan operating unit"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "out_real_partner"
        values:
          name: "Test Loan Out OU Realization Partner"
          is_company: false

      - step: "Create loan.out in operating unit A (admin default is another unit)"
        action: "create"
        model: "loan.out"
        save_as: "out_real_loan"
        values:
          date: "2024-01-01"
          partner_id: "REC: out_real_partner.id"
          type_id: "REC: loan_type_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 6000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"
          operating_unit_id: "REC: ou_a.id"

      - step: "Compute payment schedules"
        action: "call"
        target: "out_real_loan"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Confirm loan.out"
        action: "call"
        target: "out_real_loan"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.out is confirmed"
        action: "assert"
        refresh: true
        target: "out_real_loan"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve loan.out, auto-staging it to ready"
        action: "call"
        target: "out_real_loan"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Assert loan.out reached ready state"
        action: "assert"
        target: "out_real_loan"
        asserts:
          state:
            type: "value"
            expected: "ready"

      - step: "Realization move carries the operating unit of the loan"
        action: "assert"
        refresh: true
        target: "out_real_loan"
        asserts:
          move_realization_id:
            type: "value"
            operator: "is_truthy"
          move_realization_id.operating_unit_id:
            type: "m2o"
            expected: "REC: ou_a"

      - step: "No line of the realization move deviates from the loan unit"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: out_real_loan.move_realization_id.id"]
          - ["operating_unit_id", "!=", "REC: ou_a.id"]
        save_as: "out_real_deviating_ml"
        expect_count: 0

  - name:
      "Loan Out - Interest and additional item journals carry the loan operating unit"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "out_int_partner"
        values:
          name: "Test Loan Out OU Interest Partner"
          is_company: false

      - step: "Create loan.out in operating unit A (admin default is another unit)"
        action: "create"
        model: "loan.out"
        save_as: "out_int_loan"
        values:
          date: "2024-01-01"
          partner_id: "REC: out_int_partner.id"
          type_id: "REC: loan_type_out.id"
          currency_id: "REF: base.USD"
          loan_amount: 6000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"
          operating_unit_id: "REC: ou_a.id"

      - step: "Compute payment schedules"
        action: "call"
        target: "out_int_loan"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Confirm loan.out"
