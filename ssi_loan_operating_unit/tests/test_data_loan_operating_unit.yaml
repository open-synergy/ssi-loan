scenarios:
  - name: "Loan Out - Operating Unit propagation"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Loan OU Partner"
          is_company: false

      - step: "Create loan.out with operating_unit_id"
        action: "create"
        model: "loan.out"
        save_as: "loan_out"
        values:
          date: "2024-01-01"
          partner_id: "EVAL: registry['partner'].id"
          type_id: "REF: ssi_loan.demo_type_out1"
          currency_id: "REF: base.USD"
          loan_amount: 3000.0
          maximum_loan_amount: 6000.0
          interest: 3.0
          manual_loan_period: 6
          first_payment_date: "2024-02-01"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Assert loan.out operating_unit_id is set"
        action: "assert"
        target: "loan_out"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "Loan In - Operating Unit propagation"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_in"
        values:
          name: "Test Loan In OU Partner"
          is_company: true

      - step: "Create loan.in with operating_unit_id"
        action: "create"
        model: "loan.in"
        save_as: "loan_in"
        values:
          date: "2024-01-01"
          partner_id: "EVAL: registry['partner_in'].id"
          type_id: "REF: ssi_loan.demo_type_in1"
          currency_id: "REF: base.USD"
          loan_amount: 5000.0
          maximum_loan_amount: 10000.0
          interest: 2.0
          manual_loan_period: 12
          first_payment_date: "2024-02-01"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Assert loan.in operating_unit_id is set"
        action: "assert"
        target: "loan_in"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"
